[package]
name = "xmotion"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.27"
egui_extras = { version = "0.27", features = ["all_loaders"] }
image = { version = "0.24", features = ["jpeg", "png"] }

[[bin]]
name = "xmotion"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
